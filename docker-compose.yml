services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: trading-platform-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-TradingPlatform}
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api/v1}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
